name = "yc-directory-sync"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Schedule. Cron syntax is "minute hour day-of-month month day-of-week", always in UTC.
# Current: daily at 13:00 UTC (9am ET / 6am PT).
#   Twice a week, Mon + Wed at 13:00 UTC:  "0 13 * * 1,3"
#   Once a week, Friday at 13:00 UTC:      "0 13 * * 5"
#   Twice daily, 9am and 5pm UTC:          "0 9,17 * * *"
[triggers]
crons = ["0 13 * * *"]

# KV namespace used to remember which YC company IDs have already been pushed to Clay.
# Replace "id" below with the id printed by:  npx wrangler kv namespace create YC_SEEN
[[kv_namespaces]]
binding = "YC_SEEN"
id = "1825b8ca976a4c409d1857aac4287f7f"

# Search filters, matching your YC directory URL. Edit these to change what gets pulled,
# no code changes needed. Values must match YC's own facet values exactly (case-sensitive).
[vars]
YC_BATCHES = ["Fall 2026", "Summer 2026", "Spring 2026", "Winter 2026", "Fall 2025", "Summer 2025", "Winter 2027"]
YC_INDUSTRIES = ["B2B", "Consumer", "Fintech", "Healthcare", "Industrials"]
YC_REGIONS = ["America / Canada", "Europe", "Singapore", "Australia"]

# Secrets (do NOT put these here as plain vars) — set via:
#   npx wrangler secret put CLAY_WEBHOOK_URL
#   npx wrangler secret put TRIGGER_SECRET
# CLAY_WEBHOOK_URL = the webhook URL from your Clay table's Webhook source
# TRIGGER_SECRET   = any random string you make up, used to protect the manual /run endpoint
